name: Validate DQN implementation
on:
  push:
    branches: [replay_buffer_branch]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: python -m src.train --smoke --out results/ci-smoke
      - run: python -m src.train --demo
      - run: python -m src.evaluate --checkpoint results/ci-smoke/checkpoint.pt --out results/ci-evaluation --episodes 2 --video-seconds 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-experiment-evidence
          path: |
            results/
            screenshots/
            submission/
