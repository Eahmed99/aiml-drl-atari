name: Validate DQN implementation
on:
  push:
    branches: [replay_buffer_branch]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: python -m src.train --config config/smoke.json --out results/ci-smoke
      - uses: actions/download-artifact@v4
        if: contains(github.event.head_commit.message, '[recover]')
        with:
          name: assignment-experiment-evidence
          run-id: 37508726802
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered
      - run: python scripts/recover_experiment.py --source recovered
        if: contains(github.event.head_commit.message, '[recover]')
      - run: python -m src.environment_demo
        if: contains(github.event.head_commit.message, '[experiment]')
      - run: python -m src.train --config config/breakout.json --out results/breakout
        if: contains(github.event.head_commit.message, '[experiment]')
      - run: python -m src.evaluate --checkpoint results/breakout/checkpoint.pt --out results/evaluation --episodes 10
        if: contains(github.event.head_commit.message, '[experiment]') || contains(github.event.head_commit.message, '[recover]')
      - run: python -m src.plot_results --run results/breakout --evaluation results/evaluation
        if: contains(github.event.head_commit.message, '[experiment]') || contains(github.event.head_commit.message, '[recover]')
      - run: python scripts/build_presentation.py
        if: contains(github.event.head_commit.message, '[experiment]') || contains(github.event.head_commit.message, '[recover]')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-experiment-evidence
          path: |
            results/
            screenshots/
            submission/
